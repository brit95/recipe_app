name: Build executables

on:
  push:
    branches: [main, master, initial]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: RecipeManager-windows
            artifact_name: RecipeManager-windows.exe
          - os: ubuntu-latest
            artifact: RecipeManager-linux
            artifact_name: RecipeManager-linux
          - os: macos-13          # Intel x86_64 runner
            artifact: RecipeManager-macos-intel
            artifact_name: RecipeManager-macos-intel
          - os: macos-14          # Apple Silicon (arm64) runner
            artifact: RecipeManager-macos-arm64
            artifact_name: RecipeManager-macos-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Qt/PySide6 needs a few system libs on minimal Ubuntu runners.
      - name: Install Linux Qt deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxcb-xkb1 libxcb-cursor0 libegl1 libgl1 libfontconfig1 \
            libdbus-1-3

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller --clean --noconfirm RecipeManager.spec

      # Give each binary a unique, OS-tagged name so they don't collide when
      # attached to a GitHub Release alongside the others.
      - name: Rename binary (Windows)
        if: runner.os == 'Windows'
        run: Rename-Item dist/RecipeManager.exe RecipeManager-windows.exe
        shell: pwsh
      - name: Rename binary (Linux)
        if: runner.os == 'Linux'
        run: mv dist/RecipeManager dist/RecipeManager-linux
      - name: Rename binary (macOS Intel)
        if: matrix.os == 'macos-13'
        run: mv dist/RecipeManager dist/RecipeManager-macos-intel
      - name: Rename binary (macOS arm64)
        if: matrix.os == 'macos-14'
        run: mv dist/RecipeManager dist/RecipeManager-macos-arm64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact_name }}
          if-no-files-found: error

  release:
    # When you push a tag like v1.0.0, also attach the binaries to a Release.
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: |
            artifacts/RecipeManager-windows/RecipeManager-windows.exe
            artifacts/RecipeManager-linux/RecipeManager-linux
            artifacts/RecipeManager-macos-intel/RecipeManager-macos-intel
            artifacts/RecipeManager-macos-arm64/RecipeManager-macos-arm64
